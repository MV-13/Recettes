<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recettes – Les recettes de Marine</title>
  <link rel="stylesheet" href="css/style.css?v=20260621201831">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ═══ HEADER ═══════════════════════════════════════════════ -->
  <header class="header">
    <nav class="nav container">
      <a href="index.html" class="nav-logo">🍽 Les recettes de Marine</a>
      <ul class="nav-categories" id="nav-categories" aria-label="Catégories"></ul>
      <div class="nav-right">
        <button class="nav-search-btn" id="search-toggle-btn" aria-label="Rechercher">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <a href="admin.html" class="nav-admin-link">Admin</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>

    <div class="search-overlay" id="search-overlay">
      <form class="search-overlay-form" onsubmit="event.preventDefault(); const q=this.querySelector('input').value.trim(); if(q) window.location.href='category.html?search='+encodeURIComponent(q)">
        <input type="search" class="search-overlay-input" placeholder="Rechercher une recette…">
        <button type="submit" class="btn btn-primary" style="padding:.6rem 1rem">Rechercher</button>
      </form>
    </div>

    <nav class="mobile-nav" id="mobile-nav" aria-label="Navigation mobile">
      <a href="category.html" class="nav-link">Toutes les recettes</a>
      <div id="mobile-nav-categories"></div>
      <a href="admin.html" class="nav-link">Admin</a>
    </nav>
  </header>

  <!-- ═══ MAIN ════════════════════════════════════════════════ -->
  <main>

    <!-- Category hero -->
    <section class="category-hero" id="category-hero">
      <div class="container category-hero-content">
        <h1 id="page-title">Toutes les recettes</h1>
        <p id="page-desc"></p>
      </div>
    </section>

    <!-- Filters -->
    <div class="filters-section">
      <div class="container filters-inner">

        <div class="filters-toolbar">
          <div class="search-inline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" id="search-input" placeholder="Filtrer les recettes…" aria-label="Rechercher dans cette catégorie">
          </div>
          <div class="filters-toggle-wrap">
            <button id="filters-toggle-btn" class="btn btn-ghost filters-toggle-btn" aria-expanded="false" aria-controls="filters-dropdown">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/>
              </svg>
              Filtres
              <span id="filters-active-count" class="filters-active-badge" hidden>0</span>
            </button>
          </div>
          <span id="recipes-count"></span>
          <button id="reset-filters" class="btn btn-ghost" style="font-size:.8rem;padding:.4rem .9rem">Réinitialiser</button>
        </div>

        <div class="filters-dropdown" id="filters-dropdown" hidden>
          <div class="filters-row">
            <span class="filters-label">Difficulté</span>
            <button class="difficulty-filter" data-value="facile">Facile</button>
            <button class="difficulty-filter" data-value="moyen">Moyen</button>
            <button class="difficulty-filter" data-value="difficile">Difficile</button>
          </div>

          <div class="filters-row">
            <span class="filters-label">Temps total</span>
            <button class="time-filter" data-value="20">≤ 20 min</button>
            <button class="time-filter" data-value="30">≤ 30 min</button>
            <button class="time-filter" data-value="60">≤ 1 h</button>
            <button class="time-filter" data-value="120">≤ 2 h</button>
          </div>

          <div class="filters-row">
            <span class="filters-label">Tags</span>
            <div id="tags-filter" style="display:flex;flex-wrap:wrap;gap:.35rem;"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- Recipe grid -->
    <section class="section">
      <div class="container">
        <div class="recipes-grid" id="recipes-grid"></div>
        <div class="load-more-wrap">
          <button id="load-more-btn" class="btn btn-outline">Charger plus</button>
        </div>
      </div>
    </section>

  </main>

  <!-- ═══ FOOTER ══════════════════════════════════════════════ -->
  <footer class="footer">
    <div class="container footer-inner">
      <a href="index.html" class="footer-logo">🍽 Les recettes de Marine</a>
      <span>Fait avec ❤️</span>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20260621201831"></script>
  <script src="js/supabase-client.js?v=20260621201831"></script>
  <script src="js/category.js?v=20260621201831"></script>
  <script>
    const searchToggle = document.getElementById('search-toggle-btn');
    const searchOverlay = document.getElementById('search-overlay');
    searchToggle?.addEventListener('click', () => {
      const open = searchOverlay.classList.toggle('open');
      if (open) searchOverlay.querySelector('input')?.focus();
    });
  </script>

</body>
</html>
